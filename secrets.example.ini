; Шаблон. Скопируй в secrets.ini и впиши свои данные.
; secrets.ini в .gitignore — в репозиторий не попадёт.
;
; Пароль должен совпадать с OTA_PASSWORD в src/secrets.h
; IP смотри в роутере после входа платы в режим OTA,
; либо оставь aulakeys.local, если mDNS в сети работает.

[ota]
upload_port = 192.168.1.50
upload_flags = --auth=aula1234
