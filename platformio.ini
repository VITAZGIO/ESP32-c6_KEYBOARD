; AULA F75 Zigbee Keys — ESP32-C6, ESP-IDF
;
; Два окружения:
;   esp32-c6      — заливка по USB (ESP32-C6 SuperMini, встроенный USB)
;   esp32-c6-ota  — заливка по воздуху, когда плата в режиме OTA
;
; Перед первой сборкой:
;   src/secrets.example.h  → src/secrets.h   (Wi-Fi и пароль OTA)
;   secrets.example.ini    → secrets.ini     (IP и пароль OTA для заливки)

[platformio]
extra_configs = secrets.ini
default_envs = esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = espidf

monitor_speed = 115200
monitor_filters = direct

; Не трогать DTR/RTS — иначе открытие и закрытие монитора порта
; перезагружает плату, и она выпадает из режима OTA.
monitor_rts = 0
monitor_dtr = 0

board_upload.flash_size = 4MB
board_build.partitions = ota.csv
board_build.flash_mode = dio


; ── Заливка по кабелю ──
[env:esp32-c6]
upload_speed = 460800


; ── Заливка по воздуху ──
; Сначала на клавиатуре: подержать End 2 секунды, отпустить,
; зажать End + любую из цифр 4, 5, 6. Плата уходит в Wi-Fi на 10 минут.
[env:esp32-c6-ota]
upload_protocol = custom
upload_command = curl --fail --show-error -X POST -H "X-Password: ${ota.password}" --data-binary @$SOURCE http://${ota.upload_port}/update
