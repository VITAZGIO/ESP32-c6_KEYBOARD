; AULA F75 Zigbee Keys — ESP32-C6
;
; Два окружения:
;   esp32-c6      — заливка по USB (разъём CH343)
;   esp32-c6-ota  — заливка по воздуху, когда плата в режиме OTA
;
; Перед первой сборкой:
;   src/secrets.example.h  → src/secrets.h   (Wi-Fi и пароль OTA)
;   secrets.example.ini    → secrets.ini     (IP платы для OTA)

[platformio]
extra_configs = secrets.ini

; По умолчанию работаем с кабельным окружением.
; Для заливки по воздуху выбери esp32-c6-ota в Project Tasks вручную.
default_envs = esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200

; Не трогать DTR/RTS — иначе открытие и закрытие монитора порта
; перезагружает плату, и она выпадает из режима OTA.
monitor_rts = 0
monitor_dtr = 0

board_upload.flash_size = 8MB
board_build.partitions = ota.csv
board_build.flash_mode = dio

build_flags =
    -DZIGBEE_MODE_ED
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3


; ── Заливка по кабелю ──
[env:esp32-c6]
upload_speed = 460800


; ── Заливка по воздуху ──
; Сначала на клавиатуре: подержать End 2 секунды, отпустить,
; зажать End + любую из цифр 4, 5, 6. Плата уходит в Wi-Fi на 10 минут.
[env:esp32-c6-ota]
upload_protocol = espota
upload_port = ${ota.upload_port}
upload_flags = ${ota.upload_flags}